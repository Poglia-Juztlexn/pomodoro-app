<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f3ed">
    <title>Pomodoro — Focus with intention</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell" id="app" data-mode="work">
      <header class="page-header">
        <a class="wordmark" href="./" aria-label="Pomodoro home">
          <span class="wordmark-icon" aria-hidden="true">p</span>
          <span>pomodoro</span>
        </a>
        <span class="header-note">Pomodoro by Liau Jun Leon</span>
      </header>

      <section class="timer-card" aria-labelledby="page-title">
        <div class="card-heading">
          <p class="eyebrow">A LITTLE STRUCTURE, A LOT OF FOCUS</p>
          <h1 id="page-title">Pomodoro by Liau Jun Leon</h1>
          <p class="intro">Settle in, do your best work, then take a breather.</p>
        </div>

        <div class="timer-area">
          <div class="timer-ring" aria-hidden="true">
            <svg class="progress-ring" viewBox="0 0 220 220">
              <circle class="progress-track" cx="110" cy="110" r="96"></circle>
              <circle class="progress-indicator" id="progress-ring" cx="110" cy="110" r="96"></circle>
            </svg>
            <div class="timer-face">
              <span class="mode-label" id="mode-label" aria-live="polite" aria-atomic="true">Focus session</span>
              <output class="timer-display" id="timer-display" aria-label="Time remaining">25:00</output>
              <span class="timer-caption" id="timer-caption">Time to focus</span>
            </div>
          </div>

          <div class="timer-controls" aria-label="Timer controls">
            <button class="button button-primary" id="start-button" type="button">Start focus</button>
            <button class="button button-secondary" id="pause-button" type="button" disabled>Pause</button>
            <button class="button button-reset" id="reset-button" type="button" aria-label="Reset current timer">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M4.2 7.2A6.2 6.2 0 1 1 3.8 11M4.2 3.8v3.8H8"></path>
              </svg>
              <span>Reset</span>
            </button>
          </div>
        </div>

        <div class="session-summary">
          <div class="summary-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M8 3.75h8M9 3.75v4.1l-4.1 8.3a3 3 0 0 0 2.7 4.35h8.8a3 3 0 0 0 2.7-4.35L15 7.85v-4.1M7 15h10"></path>
              <path d="M8.2 18h.01M12 17h.01M15.8 18h.01"></path>
            </svg>
          </div>
          <div class="summary-copy">
            <span class="summary-label">Focus sessions</span>
            <span class="summary-note">Every completed work session counts.</span>
          </div>
          <output class="session-count" id="session-count" aria-label="Completed focus sessions" aria-live="polite">0</output>
        </div>

        <p class="status-message" id="status-message" role="status" aria-live="polite"></p>
      </section>

      <footer class="page-footer">
        <span>25 minutes of focus</span>
        <span class="footer-divider" aria-hidden="true">·</span>
        <span>5 minutes to recharge</span>
      </footer>
    </main>
  </body>
</html>
